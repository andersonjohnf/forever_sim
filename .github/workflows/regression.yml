name: Full regression

# Every test on the deploy's platform (Linux x64, Node from .nvmrc): lint, typecheck, all unit
# and all end-to-end tests. test:full's scrape:check step skips here (exit 0, with a line saying
# so): CI has no .cache/client to regenerate from, and the cache-free half of that check runs
# with the unit tests (docs/data/README.md#checking-the-committed-data). It runs beside each push's deploy without holding it up, since the
# deploy runs only the smoke suite and a Mac can pass what this platform fails. Run it by hand
# too: Actions → Full regression → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:full
      # Playwright's traces and screenshots of failed tests (its CI reporters write no HTML).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
