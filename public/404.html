<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Served by Firebase Hosting (and Pages) for a path that doesn't exist (docs/decisions.md D35). No script, no external resource: it passes the site's Content-Security-Policy. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Page not found · Forever Sim</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #0a0a0a; --muted: #737373; --border: #e5e5e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --border: #262626; } }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 28rem; padding: 2rem 1rem; text-align: center; }
      img { width: 48px; height: 48px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: var(--muted); }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border: 1px solid var(--border);
        border-radius: 0.5rem; color: inherit; text-decoration: none; font-weight: 500; }
      a:focus-visible { outline: 3px solid color-mix(in srgb, var(--fg) 40%, transparent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Page not found</h1>
      <p>There's nothing at this address. The sim itself is one page, and your setup is saved in your browser.</p>
      <a href="/">Open Forever Sim</a>
    </main>
  </body>
</html>
