<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy (docs/architecture.md, "Content-Security-Policy"): scripts, the sim worker, fonts and data only from this site; game icons from Wowhead's CDN; inline <style> elements, which the drawer, toasts, scroll lock and theme switch inject at runtime. `vite dev` serves the page without it (vite.config.ts). firebase.json sends the same policy as a header, plus frame-ancestors; src/app/hosting.test.ts keeps the two the same. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://wow.zamimg.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- What the app is (docs/ux.md, "About & data"): "DPS and TPS" since the first tank spec, Protection, shipped; e2e/shell-a11y.spec.ts compares it with the About sheet. -->
    <meta name="description" content="A DPS and TPS simulator for World of Warcraft: Forever. Everything runs in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sim.decades.gg/" />
    <meta property="og:site_name" content="Forever Sim" />
    <meta property="og:title" content="Forever Sim" />
    <meta property="og:description" content="A DPS and TPS simulator for World of Warcraft: Forever. Everything runs in your browser." />
    <title>Forever Sim</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
