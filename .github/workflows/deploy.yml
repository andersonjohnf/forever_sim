name: Deploy

# Builds, runs the smoke suite, and publishes to Firebase Hosting (decades-prod, site forever-sim),
# which serves https://sim.decades.gg/ (docs/decisions.md, D35; GitHub Pages retired at the cutover).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (checkout, npm ci, tests, build) reads the repo and nothing else.
# upload-artifact keeps dist/ for the deploy through the runner's own artifact token, not
# GITHUB_TOKEN. Only the deploy job gets the OIDC token, which Google's Workload Identity
# Federation exchanges for a short-lived token of the deploy service account: no JSON key is stored
# anywhere, and the provider trusts only this repository's main branch.
permissions:
  contents: read

# One run at a time per branch, never cancelled midway; a newer push waits and then publishes its
# own build. Keyed by ref, so a run by hand from another branch (which skips the deploy) can't
# cancel main's waiting run. Re-run only the latest run: an older run would publish an older build.
concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The smoke suite only. The full one runs locally before every push (CLAUDE.md) and in
      # the "Full regression" workflow, beside this one on every push and by hand.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # The identity provider trusts main alone, so a run by hand from another branch skips this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: firebase
      url: https://sim.decades.gg/
    steps:
      # firebase.json and .firebaserc: the site, its headers and the project.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/232648440272/locations/global/workloadIdentityPools/github/providers/forever-sim
          service_account: forever-sim-deploy@decades-prod.iam.gserviceaccount.com
      # The CLI's major pinned, so a new major's changes arrive by a commit, not by surprise.
      - run: npx --yes firebase-tools@15 deploy --only hosting:forever-sim --project decades-prod --non-interactive
