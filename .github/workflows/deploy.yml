name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (checkout, npm ci, tests, build) reads the repo and nothing else.
# upload-pages-artifact stores dist/ as a workflow artifact through the runner's own artifact
# token, not GITHUB_TOKEN, so it needs no extra scope. Only deploy-pages publishes, and it alone
# gets Pages write and the OIDC token it proves the run with.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The smoke suite only. The full one runs locally before every push (CLAUDE.md) and in
      # the "Full regression" workflow, beside this one on every push and by hand.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
